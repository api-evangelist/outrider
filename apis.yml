description: Outrider is an autonomous yard technology company that automates distribution
  yard operations with self-driving, all-electric yard trucks (hostlers). The Outrider
  System combines autonomous driving software, robotics for connecting and disconnecting
  trailers, and site operations software to move trailers between docks, parking spots,
  and staging lanes in large logistics yards. Headquartered in Golden, Colorado, Outrider
  targets shippers and logistics operators seeking to improve safety, sustainability,
  and throughput in the supply chain. The company is backed by investors including 8VC.
  No public developer API, OpenAPI, or developer portal has been identified for Outrider.
